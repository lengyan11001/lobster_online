<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI获客 · 视频号获客</title>
<link rel="icon" type="image/png" href="/static/douyin-origin/assets/app-icon.png">
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex:0 0 220px;background:linear-gradient(180deg,#0f172a,#111827);color:#cbd5e1;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#0d9488);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{color:#fff;display:block}.brand small{color:#94a3b8;font-size:11px}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;display:flex;gap:8px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}.nav button.active{background:rgba(34,197,94,.18);color:#fff;box-shadow:inset 2px 0 0 #22c55e}
.nav .dot{width:6px;height:6px;border-radius:50%;background:#475569}.nav button.active .dot{background:#22c55e}.nav .badge{margin-left:auto;font-size:10px;color:#f59e0b;border:1px solid rgba(245,158,11,.5);border-radius:99px;padding:0 5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{height:62px;flex:0 0 62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
.top h1{font-size:18px;margin:0}.top .sub{font-size:12px;color:var(--muted)}.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{flex:1;overflow:auto;padding:20px 22px 40px}.page{display:none;max-width:1400px;margin:0 auto}.page.active{display:block}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.head h2{font-size:22px;margin:0}.head p{margin:0;color:var(--muted);font-size:13px}.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.panel .ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel .ph h3{font-size:15px;margin:0}.panel .ph .hint{font-size:12px;color:var(--muted)}.panel .ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.pb{padding:16px}.pb.tight{padding:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:28px;font-weight:800;margin-top:5px}.stat .hint{font-size:11px;color:#94a3b8;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:var(--ink);outline:none}input,select{height:36px;padding:0 10px}textarea{width:100%;min-height:86px;padding:10px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.wide{width:min(430px,50vw)}.mid{width:220px}.small{width:110px}
.btn{height:36px;padding:0 13px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#374151;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:inherit;white-space:nowrap}.btn:hover{background:#f9fafb}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#16a34a,#0d9488);border-color:transparent;color:#fff;font-weight:600}.btn-primary:hover{background:linear-gradient(135deg,#16a34a,#0d9488);filter:brightness(.97)}.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn-danger{color:#b91c1c;border-color:#fecaca}.btn-sm{height:30px;padding:0 9px;font-size:12px;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 11px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}th{background:#f8fafc;color:#64748b;font-size:12px;white-space:nowrap}tr:hover td{background:#fcfdfe}
.wrap{overflow:auto;max-height:58vh}.nowrap{white-space:nowrap}.muted{color:var(--muted)}.tiny{font-size:11px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
.tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#f1f5f9;border:1px solid var(--line);color:#475569;font-size:11px;margin:1px 2px}.tag.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.tag.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.tag.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}.tag.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.empty{padding:34px 18px;text-align:center;color:#94a3b8}.empty b{display:block;color:#64748b;margin-bottom:5px}
.notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px}.notice.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
.toast{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}.toast div{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;max-width:420px}.toast .ok{background:#065f46}.toast .bad{background:#991b1b}.toast .warn{background:#92400e}
.check{width:15px;height:15px;accent-color:#16a34a;cursor:pointer}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:820px){.sidebar{position:fixed;z-index:20;left:-230px;top:0;bottom:0;transition:left .2s}.sidebar.open{left:0}.top{padding:0 12px}.content{padding:14px}.wide{width:100%}.menu{display:inline-flex!important}}
.menu{display:none}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">AI</div><div><b>AI获客</b><small>视频号 Workbench</small></div></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><button class="btn btn-sm menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><h1>视频号获客</h1><div class="sub">本地微信 UI 自动化 · 搜索 / 评论 / 账号</div></div><div class="right"><span class="tag" id="statusChip">未检查</span><button class="btn btn-sm" onclick="checkStatus()">检查窗口</button><button class="btn btn-sm btn-primary" onclick="openChannels()">打开视频号</button></div></div><div class="content" id="content"></div></main>
</div><div class="toast" id="toast"></div>
<script src="/static/channels-origin/channels-workbench.js?v=20261113-ui-v1"></script></body></html>
