<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI获客 · 视频号获客</title>
  <link rel="icon" type="image/png" href="/static/douyin-origin/assets/app-icon.png">
  <style>
    :root{--bg:#f4f6fb;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#16a34a;--danger:#dc2626;--blue:#2563eb;--sidebar:#0f172a;--sidebar2:#111827}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .app{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:232px;flex:0 0 232px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#cbd5e1;display:flex;flex-direction:column;overflow:auto}
    .brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#0d9488);display:grid;place-items:center;color:#fff;font-weight:800}
    .brand-name{font-weight:700;color:#fff;font-size:15px}.brand-sub{font-size:11px;color:#94a3b8;margin-top:2px}
    .side-label{padding:14px 18px 6px;font-size:10px;letter-spacing:.14em;color:#64748b;text-transform:uppercase}
    .nav{padding:0 10px 18px;display:flex;flex-direction:column;gap:2px}
    .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#cbd5e1;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-size:13px}
    .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.active{background:linear-gradient(90deg,rgba(34,197,94,.22),rgba(13,148,136,.12));color:#fff;box-shadow:inset 2px 0 0 #22c55e}
    .nav-dot{width:6px;height:6px;border-radius:50%;background:#475569;flex:0 0 6px}.nav-item.active .nav-dot{background:#22c55e}
    .nav-unsupported{margin-left:auto;font-size:10px;color:#f59e0b;border:1px solid rgba(245,158,11,.45);border-radius:99px;padding:0 5px}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
    .topbar{height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;flex:0 0 64px}
    .topbar h1{font-size:18px;margin:0;font-weight:700}.topbar .sub{font-size:12px;color:var(--muted);margin-left:2px}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#f1f5f9;color:#475569;font-size:12px;border:1px solid var(--line)}
    .chip.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.chip.bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.chip.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}
    .content{flex:1;overflow:auto;padding:22px 24px 40px}.section{display:none;max-width:1440px;margin:0 auto}.section.active{display:block}
    .page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}.page-head h2{font-size:22px;margin:0}.page-head p{margin:0;color:var(--muted);font-size:13px}.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .grid{display:grid;gap:14px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
    .stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.02em}.stat .hint{font-size:11px;color:#94a3b8;margin-top:4px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
    .panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel-head h3{font-size:15px;margin:0}.panel-head .hint{font-size:12px;color:var(--muted)}.panel-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .panel-body{padding:16px}.panel-body.tight{padding:0}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .input,.select,textarea{height:36px;border:1px solid #d1d5db;border-radius:9px;padding:0 11px;background:#fff;color:var(--ink);font:inherit;outline:none;min-width:0}
    .input:focus,.select:focus,textarea:focus{border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.16)}
    textarea{height:auto;min-height:88px;padding:10px 11px;resize:vertical;width:100%}
    .input.wide{width:min(420px,52vw)}.input.mid{width:220px}.input.small{width:120px}
    .btn{height:36px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#374151;padding:0 13px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .btn:hover{background:#f9fafb}.btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,#16a34a,#0d9488);border-color:transparent;color:#fff;font-weight:600}.btn-primary:hover{filter:brightness(.97);background:linear-gradient(135deg,#16a34a,#0d9488)}
    .btn-blue{background:#2563eb;border-color:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}
    .btn-danger{background:#fff;border-color:#fecaca;color:#b91c1c}.btn-danger:hover{background:#fef2f2}
    .btn-sm{height:30px;padding:0 9px;font-size:12px;border-radius:7px}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #f1f5f9;text-align:left;vertical-align:top}th{background:#f8fafc;color:#64748b;font-weight:600;font-size:12px;white-space:nowrap}tr:hover td{background:#fcfdfe}
    .table-wrap{overflow:auto;max-height:58vh}.nowrap{white-space:nowrap}.muted{color:var(--muted)}.tiny{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
    .tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#f1f5f9;color:#475569;font-size:11px;border:1px solid var(--line);margin:1px 2px 1px 0}
    .tag.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.tag.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}.tag.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.tag.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .empty{padding:36px 18px;text-align:center;color:#94a3b8}.empty strong{display:block;color:#64748b;margin-bottom:6px}
    .toast{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .toast-item{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 12px 30px rgba(15,23,42,.25);max-width:420px}
    .toast-item.ok{background:#065f46}.toast-item.bad{background:#991b1b}.toast-item.warn{background:#92400e}
    .check{width:15px;height:15px;accent-color:#16a34a;cursor:pointer}
    .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:14px}
    .kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13px}.kv .k{color:var(--muted)}.kv .v{word-break:break-all}
    .cap{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #e5e7eb}.cap:last-child{border-bottom:0}.cap .ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 22px}.cap .ico.y{background:#dcfce7;color:#15803d}.cap .ico.n{background:#fee2e2;color:#b91c1c}.cap .name{font-weight:600}.cap .note{font-size:12px;color:var(--muted);margin-top:2px}
    .notice{border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid #fde68a;background:#fffbeb;color:#92400e;margin-bottom:14px}
    .notice.blue{border-color:#bfdbfe;background:#eff6ff;color:#1e40af}.notice.green{border-color:#a7f3d0;background:#ecfdf5;color:#047857}
    .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
    @media(max-width:1180px){.grid-4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
    @media(max-width:860px){.sidebar{position:fixed;z-index:20;left:-240px;top:0;bottom:0;transition:left .2s}.sidebar.open{left:0}.main{width:100%}.topbar{padding:0 14px}.content{padding:16px}.grid-3,.grid-2{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}.menu-btn{display:inline-flex!important}.input.wide{width:100%}}
    .menu-btn{display:none}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div><div class="brand-name">AI获客</div><div class="brand-sub">视频号 Workbench</div></div>
    </div>
    <div class="side-label">WeChat Channels Menu</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="btn btn-sm menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h1 id="pageTitle">数据大屏</h1><div class="sub" id="pageSub">视频号获客 · 公开数据 + 视频号助手</div></div>
      <div class="topbar-right">
        <span class="chip" id="loginChip">登录态未检查</span>
        <span class="chip" id="keyChip">TikHub 未检查</span>
        <button class="btn btn-sm" onclick="checkLogin()">检查登录</button>
        <button class="btn btn-sm btn-primary" onclick="openLogin()">扫码登录视频号助手</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/channels-origin/channels-workbench.js?v=20261113-v1"></script>
</body>
</html>
