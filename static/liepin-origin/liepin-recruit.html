<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>猎聘招聘</title>
<style>
  :root { --line:#e5e7eb; --brand:#1f4e79; --soft:#f6f8fb; --ok:#059669; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; background:#f7f9fb; color:#111827; font-size:13px; }
  .wrap { padding:14px 16px 40px; }
  h1 { font-size:17px; margin:0 0 10px; color:var(--brand); }
  .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:8px 16px; border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0; background:#fff; cursor:pointer; color:#4b5563; }
  .tab.active { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=number], textarea, select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; }
  input[type=text] { min-width:220px; }
  textarea { width:100%; min-height:80px; }
  button { border:0; border-radius:8px; padding:7px 14px; font-size:13px; background:var(--brand); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button.mini { padding:3px 9px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--soft); border:1px solid var(--line); margin:0 6px 4px 0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:var(--soft); position:sticky; top:0; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:8px 2px; color:#6b7280; }
  .muted { color:#6b7280; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal.show { display:flex; }
  .modal .box { background:#fff; border-radius:12px; padding:16px 18px; width:min(760px,94vw); max-height:86vh; overflow:auto; }
  .modal h3 { margin:0 0 12px; font-size:15px; color:var(--brand); }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  pre { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; font-size:12px; max-height:200px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>猎聘招聘（协议直连 + 浏览器兜底）</h1>

  <div class="tabs">
    <div class="tab active" data-tab="overview">概览 / 登录</div>
    <div class="tab" data-tab="search">人才搜索</div>
    <div class="tab" data-tab="chat">沟通</div>
    <div class="tab" data-tab="apply">投递</div>
    <div class="tab" data-tab="ledger">台账</div>
  </div>

  <!-- 概览 -->
  <div class="panel active" id="panel-overview">
    <div class="card">
      <div class="row">
        <button id="btn-open">启动浏览器（扫码登录）</button>
        <button id="btn-restart" class="ghost">重启窗口</button>
        <button id="btn-refresh" class="ghost">刷新账号信息</button>
        <span id="ov-status" class="muted">—</span>
      </div>
      <div class="muted" style="margin-top:8px">首次使用：点「启动浏览器」，在弹出的 Chrome 窗口里扫码/账号登录猎聘；登录态保存在独立资料目录里，之后免登录。</div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;margin:0 0 10px">账号与额度</h3>
      <div id="ov-body" class="kv muted"><div>—</div></div>
    </div>
  </div>

  <!-- 搜索 -->
  <div class="panel" id="panel-search">
    <div class="card">
      <div class="row">
        <input type="text" id="q" placeholder="关键词，如：东南亚 销售总监 电表" />
        <button id="btn-search">搜索</button>
        <button id="btn-filter" class="ghost">高级筛选</button>
        <button id="btn-export" class="ghost">导出 Excel</button>
        <span id="s-info" class="muted"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="muted">每页
          <select id="s-pagesize"><option>20</option><option>40</option><option>60</option></select>
        </label>
        <span id="s-filtered" class="muted"></span>
      </div>
    </div>
    <div class="card">
      <div style="max-height:460px;overflow:auto">
        <table>
          <thead><tr><th>#</th><th>姓名</th><th>年龄</th><th>年限</th><th>学历</th><th>现居</th><th>期望</th><th>最近履历</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="s-rows"><tr><td colspan="10" class="muted">还没有结果</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="ghost mini" id="s-prev">上一页</button>
        <span id="s-page">第 1 页</span>
        <button class="ghost mini" id="s-next">下一页</button>
      </div>
    </div>
  </div>

  <!-- 沟通 -->
  <div class="panel" id="panel-chat">
    <div class="card">
      <div class="row">
        <button id="btn-chat-load">加载会话列表</button>
        <button id="btn-chat-send" class="ghost">发消息…</button>
        <span id="c-info" class="muted"></span>
      </div>
    </div>
    <div class="card">
      <div style="max-height:460px;overflow:auto">
        <table>
          <thead><tr><th>#</th><th>姓名</th><th>职位/公司</th><th>未读</th><th>最后消息</th><th>操作</th></tr></thead>
          <tbody id="c-rows"><tr><td colspan="6" class="muted">点「加载会话列表」</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="ghost mini" id="c-prev">上一页</button>
        <span id="c-page">第 1 页</span>
        <button class="ghost mini" id="c-next">下一页</button>
      </div>
    </div>
  </div>

  <!-- 投递 -->
  <div class="panel" id="panel-apply">
    <div class="card">
      <div class="row"><button id="btn-apply-load">加载投递列表</button><span id="a-info" class="muted"></span></div>
    </div>
    <div class="card">
      <div style="max-height:460px;overflow:auto">
        <table>
          <thead><tr><th>#</th><th>姓名</th><th>期望职位</th><th>期望城市</th><th>学历</th><th>投递时间</th></tr></thead>
          <tbody id="a-rows"><tr><td colspan="6" class="muted">点「加载投递列表」</td></tr></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="ghost mini" id="a-prev">上一页</button>
        <span id="a-page">第 1 页</span>
        <button class="ghost mini" id="a-next">下一页</button>
      </div>
    </div>
  </div>

  <!-- 台账 -->
  <div class="panel" id="panel-ledger">
    <div class="card">
      <div class="row">
        <select id="lg-kind"><option value="searches">搜索记录</option><option value="messages">已发消息</option><option value="details">已开简历</option></select>
        <button id="btn-ledger">刷新</button>
        <span id="lg-info" class="muted"></span>
      </div>
    </div>
    <div class="card"><div style="max-height:420px;overflow:auto"><table><thead id="lg-head"></thead><tbody id="lg-rows"></tbody></table></div>
      <div class="pager">
        <button class="ghost mini" id="lg-prev">上一页</button>
        <span id="lg-page">第 1 页</span>
        <button class="ghost mini" id="lg-next">下一页</button>
      </div>
    </div>
  </div>

  <div class="card"><h3 style="font-size:14px;margin:0 0 8px">执行日志</h3><pre id="log">ready</pre></div>
</div>

<!-- 高级筛选弹窗 -->
<div class="modal" id="md-filter"><div class="box">
  <h3>高级筛选</h3>
  <div class="row"><label>目前城市</label><input type="text" id="f-dqs" placeholder="印度尼西亚 / 越南 / 泰国" />
    <label>期望城市</label><input type="text" id="f-wantdqs" placeholder="可选" /></div>
  <div class="row" style="margin-top:8px"><label>职位关键词</label><input type="text" id="f-jobtitles" placeholder="销售总监" />
    <label>公司关键词</label><input type="text" id="f-company" placeholder="海兴 / 威胜 / 正泰" /></div>
  <div class="row" style="margin-top:8px"><label>年限</label><input type="text" id="f-workyears" placeholder="8,99" style="width:110px" />
    <label>语言</label><input type="text" id="f-language" placeholder="英语 / 印尼语" />
    <label>性别</label><select id="f-sex"><option value="">不限</option><option>男</option><option>女</option></select></div>
  <div class="row" style="margin-top:8px"><label>结果必须包含</label><input type="text" id="f-must" placeholder="印尼,销售总监（逗号分隔）" style="min-width:320px" /></div>
  <div class="actions"><button class="ghost" data-close>取消</button><button id="f-apply">应用筛选</button><button class="ghost" id="f-clear">清空</button></div>
</div></div>

<!-- 候选人详情弹窗 -->
<div class="modal" id="md-detail"><div class="box">
  <h3>候选人详情</h3>
  <div id="d-body" class="muted">—</div>
  <div class="actions"><button class="ghost" data-close>关闭</button></div>
</div></div>

<!-- 发消息弹窗 -->
<div class="modal" id="md-send"><div class="box">
  <h3>发消息（真实触达，需确认）</h3>
  <div class="row"><label>候选人</label><input type="text" id="m-target" placeholder="会话列表里的姓名" /></div>
  <div style="margin-top:8px"><textarea id="m-text" placeholder="消息内容"></textarea></div>
  <div class="row" style="margin-top:8px"><label class="muted"><input type="checkbox" id="m-confirm" /> 我已确认要发送</label></div>
  <div class="actions"><button class="ghost" data-close>取消</button><button id="m-send">发送</button></div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { cards: [], page: 1, pageSize: 20, filters: {}, chatPage: 1, chatSize: 30,
                applyPage: 1, applySize: 10, lgPage: 1, lgSize: 20, lgKind: 'searches', lgRows: [] };

function log(s) { const el = $('log'); el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + s + '\n' + el.textContent; }
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body || {}) });
  return await r.json();
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* tabs */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('panel-' + t.dataset.tab).classList.add('active');
});
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('show'));
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

/* 概览 */
async function refreshOverview() {
  try {
    const r = await api('/api/liepin/session/info');
    const st = r.identity ? ('<span class="tag">身份 ' + esc(r.identity) + '</span>' + (r.expire_time ? '<span class="tag">到期 ' + esc(r.expire_time) + '</span>' : '')) : '<span class="bad">未登录/拿不到账号</span>';
    const q = r.chat_quota || {};
    const quota = q.total ? ('<span class="tag">开聊额度 ' + (q.total - (q.used||0)) + '/' + q.total + '</span>') : '';
    $('ov-status').innerHTML = st + quota + '<span class="tag">未读 ' + (r.unread ?? '-') + '</span><span class="tag">新招呼 ' + (r.new_hello ?? '-') + '</span>';
    $('ov-body').innerHTML = '<div>账号</div><div>' + esc(r.user_name || '(未知)') + '</div>'
      + '<div>权益</div><div>' + Object.keys(r.privileges || {}).map(k => '<span class="tag">' + esc(k) + (r.privileges[k].total != null ? ' ' + (r.privileges[k].total - (r.privileges[k].used||0)) + '/' + r.privileges[k].total : '') + '</span>').join('') + '</div>'
      + (r.login_error ? '<div>登录信息</div><div class="bad">' + esc(r.login_error) + '</div>' : '')
      + (r.privilege_error ? '<div>权益接口</div><div class="bad">' + esc(r.privilege_error) + '</div>' : '');
    log('账号信息：' + (r.user_name||'') + ' 未读=' + r.unread + ' 新招呼=' + r.new_hello);
  } catch (e) { log('账号信息失败 ' + e); }
}
$('btn-open').onclick = async () => { log('启动浏览器…'); const r = await api('/api/liepin/browser/open', {action:'start'}); log(JSON.stringify(r).slice(0,240)); refreshOverview(); };
$('btn-restart').onclick = async () => { const r = await api('/api/liepin/browser/open', {action:'restart'}); log(JSON.stringify(r).slice(0,240)); };
$('btn-refresh').onclick = refreshOverview;

/* 搜索 */
function renderSearch() {
  const rows = state.cards;
  $('s-rows').innerHTML = rows.length ? rows.map((c, i) => {
    const comp = (c.companies || []).slice(0, 2).map(x => esc(x.company) + ' · ' + esc(String(x.position||'').slice(0, 26))).join('<br>') || '<span class="muted">—</span>';
    return '<tr><td>' + ((state.page-1)*state.pageSize + i + 1) + '</td><td>' + esc(c.name) + '</td><td>' + (c.age||'') + '</td><td>' + (c.years||'') + '</td><td>'
      + esc(c.edu) + '</td><td>' + esc(c.city) + '</td><td>' + esc(c.expect) + '</td><td>' + comp + '</td><td>'
      + (c.in_chat ? '<span class="tag">已沟通</span>' : '') + (c.active ? '<span class="tag">' + esc(c.active) + '</span>' : '')
      + '</td><td><button class="ghost mini" onclick="showDetail(' + i + ')">详情</button> '
      + '<button class="ghost mini" onclick="openSend(\'' + esc(c.name) + '\')">发消息</button></td></tr>';
  }).join('') : '<tr><td colspan="10" class="muted">没有结果</td></tr>';
  $('s-page').textContent = '第 ' + state.page + ' 页';
}
async function doSearch(page) {
  state.page = page || 1;
  const q = $('q').value.trim();
  const perProtocolPage = 20;                       // 协议一页约 20 人
  const uiPages = Math.max(1, Math.round(state.pageSize / perProtocolPage));  // 一个 UI 页 = 几个协议页
  const startProto = (state.page - 1) * uiPages;
  $('s-info').textContent = '搜索中…';
  $('btn-search').disabled = true;
  try {
    let cards = [], total = null, mode = '', lastCount = uiPages * perProtocolPage;
    for (let i = 0; i < uiPages; i++) {
      const r = await api('/api/liepin/candidates/search',
        { query: q, page: startProto + i, mode: 'protocol', filters: state.filters });
      if (!r.ok) { $('s-info').innerHTML = '<span class="bad">' + esc(r.error || '失败') + '</span>'; return; }
      if (total === null) { total = r.total; mode = r.mode; }
      const got = r.cards || [];
      cards = cards.concat(got);
      lastCount = got.length;
      if (got.length < perProtocolPage) break;      // 后面没有了
    }
    state.cards = cards;
    state.hasMore = lastCount >= perProtocolPage;
    $('s-info').innerHTML = (total || '') + ' · 本页 ' + cards.length + ' 人（' + mode + '）';
    $('s-next').disabled = !state.hasMore;
    renderSearch();
  } finally { $('btn-search').disabled = false; }
}
$('btn-search').onclick = () => doSearch(1);
$('s-next').onclick = () => { if (!state.hasMore) return; doSearch(state.page + 1); };
$('s-prev').onclick = () => { if (state.page > 1) doSearch(state.page - 1); };
$('s-pagesize').onchange = () => { state.pageSize = parseInt($('s-pagesize').value, 10); doSearch(1); };
$('btn-filter').onclick = () => openModal('md-filter');
$('f-apply').onclick = () => {
  const must = $('f-must').value.split(',').map(s => s.trim()).filter(Boolean);
  state.filters = { dqs: $('f-dqs').value.trim(), want_dqs: $('f-wantdqs').value.trim(),
    jobtitles: $('f-jobtitles').value.trim(), company: $('f-company').value.trim(),
    workyears: $('f-workyears').value.trim(), language: $('f-language').value.trim(),
    sex: $('f-sex').value, must_include: must };
  $('s-filtered').textContent = '已应用筛选：' + JSON.stringify(state.filters);
  closeModal('md-filter'); doSearch(1);
};
$('f-clear').onclick = () => { state.filters = {}; $('s-filtered').textContent = ''; closeModal('md-filter'); };
$('btn-export').onclick = async () => {
  if (!state.cards.length) return log('没有可导出的结果');
  const r = await api('/api/liepin/report/export', { rows: state.cards, format: 'xlsx' });
  log('导出：' + JSON.stringify(r).slice(0, 220));
};
window.showDetail = (i) => {
  const c = state.cards[i]; if (!c) return;
  $('d-body').innerHTML = '<div class="kv">'
    + '<div>姓名</div><div>' + esc(c.name) + '（' + esc(c.sex||'') + ' ' + (c.age||'') + '岁 ' + (c.years||'') + '年）</div>'
    + '<div>学历</div><div>' + esc(c.edu) + ' ' + esc(c.school||'') + '</div>'
    + '<div>现居/期望</div><div>' + esc(c.city) + ' → ' + esc(c.want_city||'') + '</div>'
    + '<div>期望职位</div><div>' + esc(c.expect) + '</div>'
    + '<div>标签</div><div>' + (c.tags||[]).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'
    + '<div>履历</div><div>' + (c.companies||[]).map(x => esc(x.company) + ' · ' + esc(x.position)).join('<br>') + '</div>'
    + '<div>活跃</div><div>' + esc(c.active||'') + '</div>'
    + '<div>简历ID</div><div class="muted">' + esc(c.res_id||'') + '</div>'
    + '</div>';
  openModal('md-detail');
};
window.openSend = (name) => { $('m-target').value = name || ''; openModal('md-send'); };
$('btn-chat-send').onclick = () => openModal('md-send');
$('m-send').onclick = async () => {
  if (!$('m-confirm').checked) return log('请先勾选「我已确认要发送」');
  const r = await api('/api/liepin/chat/send', { target: $('m-target').value.trim(), text: $('m-text').value.trim(), confirm: true });
  log('发送：' + JSON.stringify(r).slice(0, 240));
};

/* 沟通 */
async function loadChat(page) {
  state.chatPage = page || 1;
  const r = await api('/api/liepin/chat/list', { page: state.chatPage - 1, page_size: state.chatSize, mode: 'protocol' });
  if (!r.ok) { $('c-info').innerHTML = '<span class="bad">' + esc(r.error||'失败') + '</span>'; return; }
  $('c-info').textContent = '共 ' + (r.total ?? '-') + ' · 本页 ' + (r.count||0) + '（' + (r.mode||'') + '）';
  $('c-rows').innerHTML = (r.list||[]).length ? r.list.map((x, i) => '<tr><td>' + ((state.chatPage-1)*state.chatSize + i + 1) + '</td><td>'
    + esc(x.name||x.im_id) + '</td><td>' + esc(x.title||'') + ' ' + esc(x.company||'') + '</td><td>' + (x.unread||0) + '</td><td>'
    + esc(x.time||'') + '</td><td><button class="ghost mini" onclick="openSend(\'' + esc(x.name||'') + '\')">发消息</button></td></tr>').join('')
    : '<tr><td colspan="6" class="muted">没有会话</td></tr>';
  $('c-page').textContent = '第 ' + state.chatPage + ' 页';
  $('c-next').disabled = !(r.has_more || (r.list||[]).length >= state.chatSize);
}
$('btn-chat-load').onclick = () => loadChat(1);
$('c-next').onclick = () => loadChat(state.chatPage + 1);
$('c-prev').onclick = () => { if (state.chatPage > 1) loadChat(state.chatPage - 1); };

/* 投递 */
async function loadApply(page) {
  state.applyPage = page || 1;
  const r = await api('/api/liepin/applications/list', { page: state.applyPage - 1, page_size: state.applySize });
  if (!r.ok) { $('a-info').innerHTML = '<span class="bad">' + esc(r.error||'失败') + '</span>'; return; }
  $('a-info').textContent = '共 ' + (r.total ?? '-') + ' · 本页 ' + (r.count||0);
  $('a-rows').innerHTML = (r.list||[]).length ? r.list.map((x, i) => {
    const jw = x.jobWant || {};
    return '<tr><td>' + ((state.applyPage-1)*state.applySize + i + 1) + '</td><td>' + esc(x.resName || x.name || '') + '</td><td>'
      + esc(jw.expectJobtitleName||'') + '</td><td>' + esc(jw.expectDqName||'') + '</td><td>' + esc(x.degree||'') + '</td><td>'
      + esc(x.applyTime||'') + '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="muted">没有投递</td></tr>';
  $('a-page').textContent = '第 ' + state.applyPage + ' 页';
}
$('btn-apply-load').onclick = () => loadApply(1);
$('a-next').onclick = () => loadApply(state.applyPage + 1);
$('a-prev').onclick = () => { if (state.applyPage > 1) loadApply(state.applyPage - 1); };

/* 台账 */
async function loadLedger(page) {
  state.lgPage = page || 1;
  const kind = $('lg-kind').value;
  const r = await api('/api/liepin/ledger/read', { kind });
  const rows = (r[kind] || r['null'] || []);
  state.lgRows = rows.slice().reverse();
  const start = (state.lgPage - 1) * state.lgSize;
  const pageRows = state.lgRows.slice(start, start + state.lgSize);
  const cols = { searches: ['时间','关键词','总数','解析'], messages: ['时间','候选人','内容','已校验'],
                 details: ['时间','姓名','年龄','字符数'] }[kind] || ['数据'];
  $('lg-head').innerHTML = '<tr>' + cols.map(c => '<th>' + c + '</th>').join('') + '</tr>';
  $('lg-rows').innerHTML = pageRows.length ? pageRows.map(x => {
    const vals = { searches: [x.ts, x.query, x.total, x.count], messages: [x.ts, x.target, x.text, x.verified],
                   details: [x.ts, x.name, x.age, x.chars] }[kind] || [JSON.stringify(x)];
    return '<tr>' + vals.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>';
  }).join('') : '<tr><td colspan="6" class="muted">没有记录</td></tr>';
  $('lg-info').textContent = '共 ' + rows.length + ' 条';
  $('lg-page').textContent = '第 ' + state.lgPage + ' 页';
}
$('btn-ledger').onclick = () => loadLedger(1);
$('lg-kind').onchange = () => loadLedger(1);
$('lg-next').onclick = () => loadLedger(state.lgPage + 1);
$('lg-prev').onclick = () => { if (state.lgPage > 1) loadLedger(state.lgPage - 1); };

refreshOverview();
</script>
</body>
</html>
