<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感画布 - 必火智能</title>
    <script src="/static/canvas-ui/tailwind.js"></script>
    <link href="/static/canvas-ui/fa.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc; 
            color: #475569; 
            font-weight: 400; 
        }

        .main-title { font-weight: 500 !important; letter-spacing: -0.02em; }
        
        /* 瀑布流容器隐藏横向溢出 */
        .masonry-grid {
            column-count: 2;
            column-gap: 1.25rem; /* 稍微增加一点间距，让呼吸感更好 */
        }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        /* 删除了超大屏幕显示 5 列的规则，将最大列数锁定为 4 列 */
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.25rem;
        }

        /* 隐藏原生滚动条但保留功能 (针对标签栏) */
        .style-tab {
            padding: 8px 20px; border-radius: 9999px; font-size: 13px; white-space: nowrap;
            background: #fff; color: #475569; border: 1px solid #e5e7eb; cursor: pointer;
            transition: background-color .15s ease, color .15s ease, border-color .15s ease;
        }
        .style-tab:hover { background: #f9fafb; }
        .style-tab.is-active { background: #111827; color: #fff; border-color: #111827; font-weight: 500; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-[13px]">
    
    <!-- 顶部导航 (统一高度 h-16) -->
    

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- 左侧全局 Sidebar -->
        

        <!-- 内部二级工具栏 (带真实跳转链接) -->
        

        <!-- 核心内容区 (灵感瀑布流) -->
        <main class="flex-1 overflow-y-auto relative bg-[#f8fafc] flex flex-col p-6 lg:p-10 z-0">
            <!-- 高级氛围光晕 -->
            <div class="absolute top-0 right-0 w-[40rem] h-[40rem] bg-cyan-300/15 rounded-full blur-[120px] pointer-events-none -z-10"></div>
            <div class="absolute top-[20%] left-[-10%] w-[30rem] h-[30rem] bg-blue-400/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>

            <div class="max-w-[1600px] w-full mx-auto relative z-10">
                
                <!-- 顶部引导与筛选区 (取代原来的红色横幅) -->
                

                <!-- 瀑布流画廊区 (Masonry Grid) -->
                <div class="flex flex-col mb-8">
                    <h1 class="text-[32px] md:text-[38px] main-title text-gray-900 mb-3 tracking-tight">探索无界灵感</h1>
                    <p class="text-[14px] text-gray-500 mb-8 font-light max-w-2xl">
                        发现全网顶尖 AI 创作者的优秀作品。无需从零开始，一键复用爆款配方、提示词与工作流，轻松开启您的下一次创作。
                    </p>

                    <!-- SaaS 高级标签过滤器 -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-4">
                        <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                            <button type="button" data-style="all" class="style-tab is-active">全部发现</button>
                            <button type="button" data-style="poster" class="style-tab">爆款带货海报</button>
                            <button type="button" data-style="xhs" class="style-tab">小红书图文</button>
                            <button type="button" data-style="portrait" class="style-tab">摄影级人像</button>
                            <button type="button" data-style="cartoon" class="style-tab">3D 卡通 IP</button>
                        </div>
                        
                        <!-- 搜索与排序 -->
                        <div class="hidden lg:flex items-center space-x-3 shrink-0 ml-6">
                            <div class="relative">
                                <input id="inspirationSearch" type="text" placeholder="搜索风格 / 提示词..." class="w-48 bg-white border border-gray-200 text-[12px] rounded-full py-2 pl-8 pr-3 focus:outline-none focus:border-blue-300 focus:ring-1 focus:ring-blue-100 transition-all shadow-sm">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-[11px]"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 瀑布流画廊区 (Masonry Grid) -->
                <div class="masonry-grid" id="inspirationGrid"></div>

                <!-- 底部加载提示 -->
                <div id="inspirationLoading" class="py-12 flex flex-col items-center justify-center space-y-4">
                    <div class="w-8 h-8 rounded-full border-2 border-gray-200 border-t-blue-500 animate-spin"></div>
                    <span class="text-gray-400 text-[13px] font-light">正在探索更多灵感...</span>
                </div>

            </div>
        </main>
    </div>


<script>
(function () {
  var PLACEHOLDER = "/static/canvas-ui/thumbs/t";
  function token() { try { return localStorage.getItem('token') || ''; } catch (e) { return ''; } }
  function rowsOf(payload) {
    if (!payload) return [];
    if (Array.isArray(payload.items)) return payload.items;
    var d = payload.data;
    if (Array.isArray(d)) return d;
    if (d && Array.isArray(d.items)) return d.items;
    return [];
  }
  var STYLES = {
    all: [],
    poster: ["带货", "电商", "海报", "商品", "主图"],
    xhs: ["小红书", "图文", "笔记"],
    portrait: ["人像", "摄影", "写真"],
    cartoon: ["3d", "卡通", "ip", "盲盒"]
  };
  var state = { rows: [], style: "all", keyword: "" };
  function haystack(row) {
    return [row.name, row.description, row.tags, row.category, row.style].filter(Boolean).join(" ").toLowerCase();
  }
  function filtered() {
    var keys = STYLES[state.style] || [];
    var kw = state.keyword.toLowerCase();
    return state.rows.filter(function (row) {
      var text = haystack(row);
      if (kw && text.indexOf(kw) < 0) return false;
      if (!keys.length) return true;
      return keys.some(function (k) { return text.indexOf(String(k).toLowerCase()) >= 0; });
    });
  }
  function paint() {
    render(filtered());
    var loading = document.getElementById('inspirationLoading');
    if (loading) loading.style.display = 'none';
  }
  function render(rows) {
    var grid = document.getElementById('inspirationGrid');
    if (!grid) return;
    if (!rows.length) {
      var emptyText = state.rows.length ? '该风格暂无作品，换个分类看看' : '暂无公开灵感';
      grid.innerHTML = '<div style="column-span:all;padding:48px 0;text-align:center;color:#9ca3af;font-size:13px;">' + emptyText + '</div>';
      return;
    }
    grid.innerHTML = rows.map(function (row, i) {
      var img = row.thumbnail_url || (PLACEHOLDER + ((i % 6) + 1) + '.svg');
      var name = String(row.name || '未命名模板').replace(/[<>&"]/g, '');
      return '<div class="masonry-item relative group rounded-2xl overflow-hidden bg-gray-100 cursor-pointer shadow-sm hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-300">'
        + '<img src="' + img + '" class="w-full h-auto object-cover" alt="' + name + '" loading="lazy">'
        + '<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">'
        + '<p class="text-white text-[13px] font-medium truncate">' + name + '</p>'
        + '<div class="flex items-center gap-2 mt-2">'
        + '<button type="button" class="use-template px-3 py-1.5 rounded-full bg-white text-gray-800 text-[12px]" data-uuid="' + (row.uuid || row.id || '') + '">做同款</button>'
        + '</div></div></div>';
    }).join('');
  }
  document.querySelectorAll('[data-style]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.style = btn.getAttribute('data-style') || 'all';
      document.querySelectorAll('[data-style]').forEach(function (item) {
        item.classList.toggle('is-active', item === btn);
      });
      paint();
    });
  });
  var searchBox = document.getElementById('inspirationSearch');
  if (searchBox) {
    searchBox.addEventListener('input', function () {
      state.keyword = String(searchBox.value || '').trim();
      paint();
    });
  }
  var gridEl = document.getElementById('inspirationGrid');
  if (gridEl) {
    gridEl.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.use-template');
      if (!btn) return;
      var id = btn.getAttribute('data-uuid');
      if (id) location.href = '/api/canvas-local/canvas-frame#/canvas-editor/' + encodeURIComponent(id);
    });
  }
  fetch('/canvas-api/api/v1/projects/public?limit=24', { headers: token() ? { Authorization: 'Bearer ' + token() } : {} })
    .then(function (r) { return r.json(); })
    .then(function (d) { state.rows = rowsOf(d); paint(); })
    .catch(function () { state.rows = []; paint(); });
})();
</script>
</body>
</html>
