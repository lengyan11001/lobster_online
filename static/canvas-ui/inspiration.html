<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感画布 - 必火智能</title>
    <script src="/static/canvas-ui/tailwind.js"></script>
    <link href="/static/canvas-ui/fa.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f8fafc; 
            color: #475569; 
            font-weight: 400; 
        }

        .main-title { font-weight: 500 !important; letter-spacing: -0.02em; }
        
        /* 瀑布流容器隐藏横向溢出 */
        .masonry-grid {
            column-count: 2;
            column-gap: 1.25rem; /* 稍微增加一点间距，让呼吸感更好 */
        }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        /* 删除了超大屏幕显示 5 列的规则，将最大列数锁定为 4 列 */
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.25rem;
        }

        /* 隐藏原生滚动条但保留功能 (针对标签栏) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col text-[13px]">
    
    <!-- 顶部导航 (统一高度 h-16) -->
    

    <div class="flex flex-1 overflow-hidden relative">

            <!-- 未激活状态：生成 -->

                <!-- 底部加载提示 -->
