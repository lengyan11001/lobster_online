<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#2a2c34"/><meta name="description" content="剧查查超级工厂 — 独立 AI 创作画布"/><title>剧查查超级工厂</title><script defer="defer" src="/static/canvas-web/assets/runtime.12e3d932.js"></script><script defer="defer" src="/static/canvas-web/assets/694.eae683d4.js"></script><script defer="defer" src="/static/canvas-web/assets/main.bad865f4.js"></script><style id="lobster-canvas-hidden">/* 2026-10-01 按需求隐藏画布右侧「个人中心」挂件（入口从客户端提供）*/.canvas-workspace-profile-rail{display:none !important}</style><script id="lobster-canvas-guard">/* 2026-10-01：画布内一律不允许跳出 /static/canvas-web/。画布是 hash 路由 SPA，
   克隆/打开作品时会 pushState('/#/canvas-editor/<uuid>') 直接跳到站点根，导致 iframe 被顶成客户端整页（未登录=登录页 + 套娃）。
   这里把这类 URL 改写成画布自身路由，保证始终留在画布里。*/
(function(){
  var ROOT="/static/canvas-web/";
  function keep(u){try{if(!u)return u;var x=new URL(u,location.href);if(x.origin!==location.origin)return u;
    var p=x.pathname;if(p.indexOf(ROOT)===0||p.indexOf("/canvas-api/")===0||p.indexOf("/api/canvas-local/")===0)return u;
    return ROOT+"index.html"+p+(x.search||"")+(x.hash||"");}catch(e){return u;}}
  function bad(u){try{if(!u)return false;var x=new URL(u,location.href);if(x.origin!==location.origin)return false;
    var p=x.pathname;return p.indexOf(ROOT)!==0&&p.indexOf("/canvas-api/")!==0&&p.indexOf("/api/canvas-local/")!==0;}catch(e){return false;}}
  var ps=history.pushState.bind(history),rs=history.replaceState.bind(history);
  history.pushState=function(s,t,u){if(u!=null)u=keep(String(u));return ps(s,t,u);};
  history.replaceState=function(s,t,u){if(u!=null)u=keep(String(u));return rs(s,t,u);};
  var _a=location.assign.bind(location);location.assign=function(u){if(bad(u)){console.warn("[canvas] blocked assign",u);return;}_a(u);};
  var _r=location.replace.bind(location);location.replace=function(u){if(bad(u)){console.warn("[canvas] blocked replace",u);return;}_r(u);};
  var _o=window.open;window.open=function(u){if(bad(u)){console.warn("[canvas] blocked open",u);return null;}return _o.apply(window,arguments);};
})();
</script></head><body><noscript>请启用 JavaScript 以使用剧查查超级工厂。</noscript><div id="root"></div></body></html>
