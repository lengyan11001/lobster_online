<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#2a2c34"/><meta name="description" content="剧查查超级工厂 — 独立 AI 创作画布"/><title>剧查查超级工厂</title><script defer="defer" src="/static/canvas-web/assets/runtime.391d52ce.js"></script><script defer="defer" src="/static/canvas-web/assets/694.eae683d4.js"></script><script defer="defer" src="/static/canvas-web/assets/main.264721e0.js"></script><style id="lobster-canvas-hidden">/* 2026-10-01 按需求隐藏画布右侧「个人中心」挂件（入口从客户端提供）*/.canvas-workspace-profile-rail{display:none !important}
/* 2026-10-05 按需求去掉顶部「文档教程」按钮（它本身是空 onClick。新手引导❓保留）*/
.CanvasEditor-toolbar-right button[title="查看文档教程"]{display:none !important}</style><script id="lobster-canvas-guard">/* 2026-10-01：画布内一律不允许跳出 /static/canvas-web/。画布是 hash 路由 SPA，
   克隆/打开作品时会 pushState('/#/canvas-editor/<uuid>') 直接跳到站点根，导致 iframe 被顶成客户端整页（未登录=登录页 + 套娃）。
   这里把这类 URL 改写成画布自身路由，保证始终留在画布里。*/
(function(){
  /* 注意：ROOT 是「画布路由根」。主站子路径挂载时是 /static/canvas-web/（这里的默认值，
     老客户端 8000 内嵌走这条，必须把 '/#/...' 改回画布内）；独立 origin（8003）时
     backend/canvas_app.py 会把下面这行注入成 var ROOT="/";，于是同源跳转原样放行。*/
  var ROOT="/static/canvas-web/";
  function inCanvas(p){return p.indexOf(ROOT)===0||p.indexOf("/canvas-api/")===0||p.indexOf("/api/canvas-local/")===0;}
  function keep(u){try{if(!u)return u;var x=new URL(u,location.href);if(x.origin!==location.origin)return u;
    var p=x.pathname;if(inCanvas(p))return u;
    return ROOT+"index.html"+p+(x.search||"")+(x.hash||"");}catch(e){return u;}}
  function bad(u){try{if(!u)return false;var x=new URL(u,location.href);if(x.origin!==location.origin)return false;
    return !inCanvas(x.pathname);}catch(e){return false;}}
  var ps=history.pushState.bind(history),rs=history.replaceState.bind(history);
  history.pushState=function(s,t,u){if(u!=null)u=keep(String(u));return ps(s,t,u);};
  history.replaceState=function(s,t,u){if(u!=null)u=keep(String(u));return rs(s,t,u);};
  var _a=location.assign.bind(location);location.assign=function(u){if(bad(u)){console.warn("[canvas] blocked assign",u);return;}_a(u);};
  var _r=location.replace.bind(location);location.replace=function(u){if(bad(u)){console.warn("[canvas] blocked replace",u);return;}_r(u);};
  var _o=window.open;window.open=function(u){if(bad(u)){console.warn("[canvas] blocked open",u);return null;}return _o.apply(window,arguments);};
})();
</script>
<script id="lobster-canvas-tour-close">/* 2026-10-05：新手引导的「关闭」按钮点了没反应（Joyride 受控 stepIndex 下 close 不会结束引导），
   这里兜底：点关闭后若引导还在，就替它点能生效的「跳过」，效果一致（关闭并记完成）。
   引导可以留着，但这个按钮必须能用。*/
(function(){
  function findClose(t){try{return t&&t.closest?t.closest('.react-joyride__tooltip [data-action="close"], [data-action="close"]'):null;}catch(e){return null;}}
  document.addEventListener('click',function(ev){
    if(!findClose(ev.target))return;
    window.setTimeout(function(){
      try{
        var skip=document.querySelector('.react-joyride__tooltip [data-action="skip"], [data-action="skip"]');
        if(skip){skip.click();}
      }catch(e){}
    },60);
  },true);
})();
</script></head><body><noscript>请启用 JavaScript 以使用剧查查超级工厂。</noscript><div id="root"></div></body></html>
