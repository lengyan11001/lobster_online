<div class="page-shell" style="padding:1rem 1.2rem;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.75rem;flex-wrap:wrap;">
    <div>
      <h2 style="margin:0;font-size:1.25rem;">代理配置</h2>
      <p class="meta" style="margin:0.3rem 0 0 0;font-size:0.82rem;">单个/批量导入代理，批量检测连通性；发布中心只会使用检测通畅的代理。</p>
    </div>
    <div style="display:flex;gap:0.45rem;flex-wrap:wrap;">
      <button type="button" class="btn btn-ghost btn-sm" id="proxyPageRefresh">刷新</button>
      <button type="button" class="btn btn-ghost btn-sm" id="proxyPageTestAll">批量测试</button>
      <button type="button" class="btn btn-primary btn-sm" id="proxyPageAdd">+ 添加代理</button>
    </div>
  </div>
  <div id="proxyPageSummary" class="meta" style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem;margin-top:0.7rem;"></div>
  <div id="proxyPageMsg" class="meta" style="font-size:0.8rem;margin-top:0.4rem;"></div>
  <div id="proxyList" style="margin-top:0.85rem;"><p class="meta">加载中…</p></div>
</div>

<div id="proxyAddModal" class="modal-mask" style="display:none;">
  <div class="modal" style="max-width:560px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
      <h4 style="margin:0;font-size:1.05rem;">添加代理</h4>
      <button type="button" class="btn btn-ghost btn-sm" id="proxyAddModalClose">关闭</button>
    </div>
    <div style="display:flex;gap:0.4rem;margin-bottom:0.75rem;">
      <button type="button" class="btn btn-ghost btn-sm" id="proxyAddTabSingle">单个添加</button>
      <button type="button" class="btn btn-ghost btn-sm" id="proxyAddTabBatch">批量导入</button>
    </div>
    <div id="proxyAddSingle">
      <input id="proxyAddLabel" placeholder="备注名（可选）" style="width:100%;margin-bottom:0.4rem;padding:0.45rem;">
      <input id="proxyAddServer" placeholder="http://host:port 或 host:port" style="width:100%;margin-bottom:0.4rem;padding:0.45rem;">
      <div style="display:flex;gap:0.4rem;margin-bottom:0.55rem;">
        <input id="proxyAddUser" placeholder="用户名（可选）" style="flex:1;padding:0.45rem;">
        <input id="proxyAddPass" type="password" placeholder="密码（可选）" style="flex:1;padding:0.45rem;">
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="proxyAddSave">保存</button>
      <span id="proxyAddMsg" class="meta" style="font-size:0.78rem;margin-left:0.4rem;"></span>
    </div>
    <div id="proxyAddBatch" style="display:none;">
      <p class="meta" style="font-size:0.75rem;margin:0 0 0.4rem 0;">每行一个，支持：<br>http://user:pass@host:port<br>host:port:user:pass<br>host:port<br>备注|host:port:user:pass</p>
      <textarea id="proxyImportText" rows="8" style="width:100%;padding:0.45rem;font-size:0.8rem;" placeholder="104.253.90.198:5618:user:pass"></textarea>
      <button type="button" class="btn btn-primary btn-sm" id="proxyImportSave" style="margin-top:0.45rem;">导入</button>
      <span id="proxyImportMsg" class="meta" style="font-size:0.78rem;margin-left:0.4rem;"></span>
    </div>
  </div>
</div>
