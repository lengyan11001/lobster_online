<div id="aliRoot" class="ali-root">
  <style>
    .ali-root {
      --ali-ink: #1f2937;
      --ali-text: #4b5563;
      --ali-muted: #94a3b8;
      --ali-line: #e6eaf1;
      --ali-soft: #f6f8fc;
      --ali-blue: #2f6fed;
      --ali-blue-soft: #eaf1ff;
      --ali-green: #12a150;
      --ali-amber: #d97706;
      --ali-red: #dc2626;
      --ali-violet: #7c3aed;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      background: var(--ali-soft);
      color: var(--ali-text);
      font-size: 13px;
    }
    .ali-root * { box-sizing: border-box; }
    .ali-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--ali-line);
      flex: 0 0 auto;
    }
    .ali-top-left, .ali-top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ali-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ali-brand-mark {
      width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
      background: linear-gradient(135deg, #2f6fed, #7c3aed);
      color: #fff; font-weight: 700; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .ali-brand-title { font-size: 14px; font-weight: 600; color: var(--ali-ink); line-height: 1.2; }
    .ali-brand-sub { font-size: 11px; color: var(--ali-muted); margin-top: 1px; }
    .ali-body { display: flex; flex: 1 1 auto; min-height: 0; }
    .ali-nav {
      width: 184px; flex: 0 0 auto; padding: 10px 8px; background: #fff;
      border-right: 1px solid var(--ali-line); overflow: auto;
    }
    .ali-nav-group { font-size: 11px; color: var(--ali-muted); padding: 10px 10px 4px; letter-spacing: .04em; }
    .ali-nav-item {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 9px;
      background: transparent; color: var(--ali-text); font-size: 13px; cursor: pointer; text-align: left;
    }
    .ali-nav-item:hover { background: var(--ali-soft); color: var(--ali-ink); }
    .ali-nav-item.is-active { background: var(--ali-blue-soft); color: var(--ali-blue); font-weight: 600; }
    .ali-nav-item .ali-nav-ico { width: 16px; text-align: center; opacity: .85; }
    .ali-nav-item .ali-nav-count {
      margin-left: auto; font-size: 11px; color: var(--ali-muted);
      background: var(--ali-soft); border-radius: 999px; padding: 1px 7px;
    }
    .ali-nav-item.is-active .ali-nav-count { background: #fff; color: var(--ali-blue); }
    .ali-main { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 14px 16px 40px; }
    .ali-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .ali-h1 { font-size: 16px; font-weight: 600; color: var(--ali-ink); }
    .ali-hint { font-size: 12px; color: var(--ali-muted); margin-top: 3px; }
    .ali-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ali-card { background: #fff; border: 1px solid var(--ali-line); border-radius: 12px; }
    .ali-card + .ali-card { margin-top: 12px; }
    .ali-card-head { padding: 11px 14px; border-bottom: 1px solid var(--ali-line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ali-card-title { font-size: 13px; font-weight: 600; color: var(--ali-ink); }
    .ali-card-body { padding: 12px 14px; }
    .ali-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(142px, 1fr)); gap: 10px; }
    .ali-stat {
      background: #fff; border: 1px solid var(--ali-line); border-radius: 12px; padding: 12px 13px;
      cursor: pointer; transition: box-shadow .15s, transform .15s;
    }
    .ali-stat:hover { box-shadow: 0 6px 18px rgba(31, 41, 55, .08); transform: translateY(-1px); }
    .ali-stat-num { font-size: 22px; font-weight: 700; color: var(--ali-ink); line-height: 1.1; }
    .ali-stat-label { font-size: 12px; color: var(--ali-muted); margin-top: 4px; }
    .ali-stat-note { font-size: 11px; color: var(--ali-muted); margin-top: 6px; }
    .ali-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ali-line);
      background: #fff; color: var(--ali-text); font-size: 12.5px; cursor: pointer; white-space: nowrap;
    }
    .ali-btn:hover { border-color: #cfd8e6; color: var(--ali-ink); }
    .ali-btn.primary { background: var(--ali-blue); border-color: var(--ali-blue); color: #fff; }
    .ali-btn.primary:hover { background: #2a63d6; }
    .ali-btn.ghost { background: transparent; border-color: transparent; color: var(--ali-muted); }
    .ali-btn.ghost:hover { background: var(--ali-soft); color: var(--ali-ink); }
    .ali-btn.danger { color: var(--ali-red); border-color: #f2c9c9; background: #fff6f6; }
    .ali-btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
    .ali-btn[disabled] { opacity: .5; cursor: not-allowed; }
    .ali-select, .ali-input {
      height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--ali-line);
      background: #fff; color: var(--ali-text); font-size: 12.5px; min-width: 120px;
    }
    .ali-input { min-width: 0; width: 100%; }
    textarea.ali-input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 1.55; resize: vertical; }
    .ali-badge {
      display: inline-flex; align-items: center; gap: 4px;
      height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px;
      background: var(--ali-soft); color: var(--ali-muted); border: 1px solid transparent;
    }
    .ali-badge.ok { background: #e9f8ef; color: var(--ali-green); }
    .ali-badge.warn { background: #fff5e6; color: var(--ali-amber); }
    .ali-badge.err { background: #fdecec; color: var(--ali-red); }
    .ali-badge.info { background: var(--ali-blue-soft); color: var(--ali-blue); }
    .ali-badge.violet { background: #f3ecff; color: var(--ali-violet); }
    .ali-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .ali-table th {
      position: sticky; top: 0; z-index: 1; background: #fbfcfe; text-align: left; font-weight: 600;
      font-size: 12px; color: var(--ali-muted); padding: 9px 12px; border-bottom: 1px solid var(--ali-line);
    }
    .ali-table td { padding: 10px 12px; border-bottom: 1px solid #f1f4f9; vertical-align: middle; }
    .ali-table tr { cursor: pointer; }
    .ali-table tbody tr:hover td { background: #fbfcff; }
    .ali-cell-main { color: var(--ali-ink); font-weight: 600; }
    .ali-cell-sub { color: var(--ali-muted); font-size: 11.5px; margin-top: 2px; }
    .ali-empty { padding: 38px 20px; text-align: center; color: var(--ali-muted); }
    .ali-empty-ico { font-size: 30px; opacity: .5; }
    .ali-empty-title { margin-top: 8px; color: var(--ali-ink); font-weight: 600; }
    .ali-empty-hint { margin-top: 4px; font-size: 12px; }
    .ali-empty-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }
    .ali-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--ali-line); margin-bottom: 12px; }
    .ali-tab {
      border: 0; background: transparent; padding: 8px 12px; font-size: 12.5px; color: var(--ali-muted);
      cursor: pointer; border-bottom: 2px solid transparent;
    }
    .ali-tab.is-active { color: var(--ali-blue); border-bottom-color: var(--ali-blue); font-weight: 600; }
    .ali-pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 12px; color: var(--ali-muted); font-size: 12px; }
    /* 抽屉 */
    .ali-drawer-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .28); z-index: 60; }
    .ali-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 92vw); z-index: 61;
      background: #fff; border-left: 1px solid var(--ali-line); display: flex; flex-direction: column;
      box-shadow: -18px 0 42px rgba(15, 23, 42, .16); animation: aliSlideIn .18s ease-out;
    }
    @keyframes aliSlideIn { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
    .ali-drawer-head { padding: 12px 16px; border-bottom: 1px solid var(--ali-line); display: flex; align-items: flex-start; gap: 10px; }
    .ali-drawer-title { font-size: 14px; font-weight: 600; color: var(--ali-ink); }
    .ali-drawer-sub { font-size: 12px; color: var(--ali-muted); margin-top: 3px; }
    .ali-drawer-body { flex: 1 1 auto; overflow: auto; padding: 14px 16px; }
    .ali-drawer-foot { padding: 10px 16px; border-top: 1px solid var(--ali-line); display: flex; gap: 8px; justify-content: flex-end; background: #fcfdff; }
    .ali-close { margin-left: auto; }
    /* hidden 属性必须优先于 display 规则，否则弹窗/抽屉会在初始状态就盖住整页 */
    .ali-modal-mask[hidden], .ali-drawer-mask[hidden], .ali-drawer[hidden] { display: none !important; }
    /* 弹窗 */
    .ali-modal-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .34); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .ali-modal { background: #fff; border-radius: 14px; width: 560px; max-width: 100%; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(15, 23, 42, .24); }
    .ali-modal.is-wide { width: 760px; }
    .ali-modal.is-slim { width: 440px; }
    .ali-modal-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--ali-line); font-size: 14px; font-weight: 600; color: var(--ali-ink); }
    .ali-modal-body { padding: 14px 16px; overflow: auto; }
    .ali-modal-foot { padding: 10px 16px; border-top: 1px solid var(--ali-line); display: flex; gap: 8px; justify-content: flex-end; background: #fcfdff; border-radius: 0 0 14px 14px; }
    .ali-field { margin-bottom: 12px; }
    .ali-field-label { font-size: 12px; color: var(--ali-muted); margin-bottom: 5px; }
    .ali-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ali-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ali-inline { display: flex; align-items: center; gap: 8px; }
    .ali-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
    /* 消息气泡 */
    .ali-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow: auto; padding: 4px 2px; }
    .ali-msg { max-width: 82%; padding: 8px 11px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
    .ali-msg.buyer { align-self: flex-start; background: var(--ali-soft); color: var(--ali-ink); }
    .ali-msg.seller { align-self: flex-end; background: var(--ali-blue-soft); color: #1e3a8a; }
    .ali-msg-meta { font-size: 10.5px; color: var(--ali-muted); margin-top: 3px; }
    .ali-kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 12.5px; }
    .ali-kv dt { color: var(--ali-muted); }
    .ali-kv dd { margin: 0; color: var(--ali-ink); word-break: break-word; }
    .ali-evidence { border: 1px solid var(--ali-line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
    .ali-evidence-title { font-weight: 600; color: var(--ali-ink); font-size: 12.5px; }
    .ali-evidence-snip { color: var(--ali-text); font-size: 12px; margin-top: 4px; line-height: 1.6; }
    .ali-toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
    .ali-toast { background: #111827; color: #fff; border-radius: 10px; padding: 9px 13px; font-size: 12.5px; box-shadow: 0 12px 30px rgba(15, 23, 42, .3); max-width: 380px; }
    .ali-toast.err { background: #b91c1c; }
    .ali-toast.ok { background: #15803d; }
    .ali-skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #eef1f6, #f8fafc, #eef1f6); background-size: 200% 100%; animation: aliSkel 1.2s infinite; }
    @keyframes aliSkel { from { background-position: 0 0; } to { background-position: -200% 0; } }
    .ali-sep { height: 1px; background: var(--ali-line); margin: 14px 0; }
    .ali-note { font-size: 12px; color: var(--ali-muted); line-height: 1.65; }
    .ali-queue-item { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #f1f4f9; cursor: pointer; }
    .ali-queue-item:last-child { border-bottom: 0; }
    .ali-queue-item:hover { background: #fbfcff; }
    .ali-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ali-soft); display: flex; align-items: center; justify-content: center; color: var(--ali-muted); font-size: 12px; flex: 0 0 auto; overflow: hidden; }
    .ali-avatar img { width: 100%; height: 100%; object-fit: cover; }
  </style>

  <header class="ali-top">
    <div class="ali-top-left">
      <button type="button" class="ali-btn ghost" id="aliBackBtn">← 技能商店</button>
      <div class="ali-brand">
        <span class="ali-brand-mark">ALI</span>
        <div>
          <div class="ali-brand-title">阿里国际站接管</div>
          <div class="ali-brand-sub" id="aliAccountLine">选择账号后开始</div>
        </div>
      </div>
    </div>
    <div class="ali-top-right">
      <select class="ali-select" id="aliAccountSelect" title="选择阿里账号"></select>
      <span class="ali-badge" id="aliTakeoverBadge">AI 未接管</span>
      <span class="ali-badge info" id="aliScheduleBadge">排期 —</span>
      <button type="button" class="ali-btn" id="aliRunBtn">跑一轮接待</button>
      <button type="button" class="ali-btn primary" id="aliSyncBtn">同步询盘</button>
      <button type="button" class="ali-btn ghost" id="aliSettingsBtn" title="排期与红线">⚙</button>
    </div>
  </header>

  <div class="ali-body">
    <nav class="ali-nav" id="aliNav"></nav>
    <main class="ali-main" id="aliMain"></main>
  </div>

  <div class="ali-drawer-mask" id="aliDrawerMask" hidden></div>
  <aside class="ali-drawer" id="aliDrawer" hidden>
    <div class="ali-drawer-head" id="aliDrawerHead"></div>
    <div class="ali-drawer-body" id="aliDrawerBody"></div>
    <div class="ali-drawer-foot" id="aliDrawerFoot"></div>
  </aside>

  <div class="ali-modal-mask" id="aliModalMask" hidden>
    <div class="ali-modal" id="aliModal">
      <div class="ali-modal-head" id="aliModalHead"></div>
      <div class="ali-modal-body" id="aliModalBody"></div>
      <div class="ali-modal-foot" id="aliModalFoot"></div>
    </div>
  </div>

  <div class="ali-toasts" id="aliToasts"></div>
</div>
