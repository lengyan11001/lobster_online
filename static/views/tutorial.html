<section id="content-tutorial" class="content-block app-tutorial-page">
  <div class="app-tutorial-hero">
    <div>
      <span class="app-tutorial-kicker">使用教程</span>
      <h2>从配置到执行，按工作顺序快速开始</h2>
      <p>先完成人设与资料配置，再选择技能或员工执行任务；执行结果统一进入内容记录。</p>
    </div>
  </div>
  <div class="app-tutorial-grid">
    <button type="button" class="app-tutorial-card" data-view="personal-settings" data-feature-gate="personal_settings_entry">
      <span class="app-tutorial-index">01</span><strong>配置 IP 人设</strong><span>填写资料调查、关键词、同行账号和数字人配置。</span>
    </button>
    <button type="button" class="app-tutorial-card" data-view="skill-store" data-feature-gate="skill_store_entry">
      <span class="app-tutorial-index">02</span><strong>选择工作能力</strong><span>进入技能商店，查看当前账号已授权的技能。</span>
    </button>
    <button type="button" class="app-tutorial-card" data-view="agent" data-feature-gate="agent_entry">
      <span class="app-tutorial-index">03</span><strong>启动 AI 执行</strong><span>在执行台查看设备、任务和员工运行状态。</span>
    </button>
    <button type="button" class="app-tutorial-card" data-view="production" data-feature-gate="production_records_entry">
      <span class="app-tutorial-index">04</span><strong>查看内容结果</strong><span>在内容记录中预览、下载、继续创作或发布。</span>
    </button>
  </div>
</section>
