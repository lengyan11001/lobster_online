  <div class="oe-shell">
    <header class="oe-head">
      <div class="oe-head-copy">
        <p class="oe-kicker">我的 AI 员工</p>
        <h1>员工工作流</h1>
        <p>在 Online 内配置、保存和启用员工。节点执行沿用 H5 工作流服务，并按账号权限显示。</p>
      </div>
      <div class="oe-head-actions">
        <button type="button" class="oe-btn" data-oe-action="refresh">刷新</button>
        <button type="button" class="oe-btn" data-oe-action="new">新建员工</button>
      </div>
    </header>
    <div id="oeError" class="oe-error" hidden></div>
    <div class="oe-layout">
      <aside class="oe-panel oe-list-panel" aria-label="员工列表">
        <div class="oe-list-head"><strong>员工列表</strong><span>系统销售固定保留，其他员工来自当前账号可访问的模板。</span></div>
        <div id="oeTemplateList" class="oe-template-list"><div class="oe-loading">正在加载员工...</div></div>
      </aside>
      <main class="oe-panel oe-editor" aria-label="员工工作流编辑器">
        <div id="oeEditorEmpty" class="oe-empty-editor">请选择左侧员工，查看或编辑工作流。</div>
        <div id="oeEditorBody" hidden>
          <div class="oe-editor-head">
            <div class="oe-editor-title"><h2 id="oeEditorTitle">销售员工</h2><p id="oeEditorSubtitle">销售 24 小时工作流</p></div>
            <span id="oeActiveStatus" class="oe-status">未启用</span>
          </div>
          <div class="oe-toolbar">
            <div class="oe-actions">
              <button type="button" class="oe-btn" data-oe-action="add">添加节点</button>
              <button type="button" class="oe-btn" data-oe-action="save">保存员工</button>
              <button type="button" class="oe-btn primary" data-oe-action="activate">启用员工</button>
              <button type="button" class="oe-btn danger" data-oe-action="stop">停用</button>
              <button type="button" class="oe-btn danger" data-oe-action="delete-template">删除员工</button>
            </div>
          </div>
          <div class="oe-name-row"><label for="oeTemplateName">员工名称</label><input id="oeTemplateName" maxlength="160" placeholder="例如：销售员工"></div>
          <div class="oe-timeline-head"><strong>执行时间线</strong><span id="oeTimelineMeta">0 个节点</span></div>
          <div id="oeTimeline" class="oe-timeline"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="oeNodeModal" class="oe-modal" hidden aria-modal="true" role="dialog" aria-labelledby="oeNodeModalTitle">
    <div class="oe-modal-card">
      <div class="oe-modal-head"><strong id="oeNodeModalTitle">添加工作流节点</strong><button type="button" class="oe-mini-btn" data-oe-action="close-modal">关闭</button></div>
      <div class="oe-modal-body">
        <div class="oe-form-grid">
          <label class="oe-form-label">开始时间<input id="oeNodeTime" type="time" required></label>
          <label class="oe-form-label">结束时间<input id="oeNodeEndTime" type="time"></label>
        </div>
        <label class="oe-form-label">执行节点<select id="oeNodeKey"></select></label>
        <label class="oe-form-label" id="oeNodeGroupInviteField" hidden>
          <span>自动拉群</span>
          <span><input id="oeNodeGroupInviteEnabled" type="checkbox"> 命中拉群规则后立即执行</span>
        </label>
        <label class="oe-form-label" id="oeNodeWechatPrivateSessionLimitField" hidden>
          <span>本轮个人会话数量</span>
          <span><input id="oeNodeWechatPrivateSessionLimit" type="number" min="1" max="100" step="1" value="10"> 达到数量后进入下一轮</span>
        </label>
        <label class="oe-form-label" id="oeNodeDouyinReplyModeField" hidden>
          <span>鎶栭煶绉佷俊鍥炲绛栫暐</span>
          <select id="oeNodeDouyinReplyMode"><option value="fixed">鍥哄畾璇濇湇</option><option value="ai_lead">AI 寮曞鍔犵豫娉℃场</option></select>
        </label>
        <label class="oe-form-label" id="oeNodeWechatAddFriendField" hidden>
          <span>抖音私信识别手机号后加微信好友</span>
          <span><input id="oeNodeWechatAddFriendEnabled" type="checkbox"> 自动提交好友申请</span>
        </label>
        <div class="oe-form-label" id="oeNodeDouyinCollectionField" hidden>
          <span>精准获客参数</span>
          <label>采集关键词<textarea id="oeNodeDouyinKeyword" rows="3" placeholder="例如：深圳装修、口腔种植、母婴门店"></textarea></label>
          <label>地区<input id="oeNodeDouyinRegions" type="text" value="全国" placeholder="全国，或用逗号分隔多个城市"></label>
          <label>搜索数量<input id="oeNodeDouyinMaxResults" type="number" min="10" max="100" step="1" value="50"></label>
          <label>搜索方式<select id="oeNodeDouyinMode"><option value="script">浏览器脚本</option><option value="api">接口模式</option></select></label>
        </div>
        <div class="oe-form-label" id="oeNodeDouyinFollowupField" hidden>
          <span>采集后继续执行（可多选）</span>
          <label><input id="oeNodeDouyinFollowupReplyComments" type="checkbox"> 回复客户评论</label>
          <label><input id="oeNodeDouyinFollowupMentionComment" type="checkbox"> 评论并@客户</label>
          <label><input id="oeNodeDouyinFollowupFollowComment" type="checkbox"> 关注并评论</label>
          <label><input id="oeNodeDouyinFollowupDirectMessage" type="checkbox"> 主动私信</label>
        </div>
        <div class="oe-form-label" id="oeNodeMomentField" hidden>
          <span>朋友圈联系人（按微信号保存，可多选）</span>
          <details class="oe-moment-dropdown">
            <summary id="oeNodeMomentTrigger">选择通讯录联系人</summary>
            <div class="oe-moment-picker">
              <input id="oeNodeMomentSearch" type="search" placeholder="搜索昵称、备注或微信号">
              <div class="oe-moment-list" id="oeNodeMomentContacts"></div>
              <div class="oe-moment-footer"><button class="oe-mini-btn" id="oeNodeMomentPrev" type="button" data-oe-action="moment-node-prev">上一页</button><span id="oeNodeMomentPage">1 / 1</span><button class="oe-mini-btn" id="oeNodeMomentNext" type="button" data-oe-action="moment-node-next">下一页</button></div>
              <div class="oe-moment-summary" id="oeNodeMomentSummary"></div>
            </div>
          </details>
        </div>
        <label class="oe-form-label" hidden>互动动作<select id="oeNodeMomentAction"><option value="like_comment">点赞并评论</option><option value="like">只点赞</option><option value="comment">只评论</option></select></label>
        <label class="oe-form-label">显示标题<input id="oeNodeLabel" maxlength="160"></label>
        <label class="oe-form-label">节点说明<textarea id="oeNodeNote" maxlength="2000"></textarea></label>
      </div>
      <div class="oe-modal-foot"><button type="button" class="oe-btn" data-oe-action="close-modal">取消</button><button type="button" class="oe-btn primary" data-oe-action="save-node">保存节点</button></div>
    </div>
  </div>
  <div id="oeChildModal" class="oe-modal" hidden aria-modal="true" role="dialog" aria-labelledby="oeChildModalTitle">
    <div class="oe-modal-card">
      <div class="oe-modal-head"><div><strong id="oeChildModalTitle">添加下级动作</strong><div class="oe-node-note" id="oeChildParent"></div></div><button type="button" class="oe-mini-btn" data-oe-action="close-child-modal">关闭</button></div>
      <div class="oe-modal-body">
        <div class="oe-form-grid">
          <label class="oe-form-label">开始时间<input id="oeChildTime" type="time" required></label>
          <label class="oe-form-label">结束时间（可选）<input id="oeChildEndTime" type="time"></label>
          <label class="oe-form-label">下级动作<select id="oeChildType"></select></label>
        </div>
        <label class="oe-form-label" id="oeChildPlatformField">发布平台<select id="oeChildPlatform"><option value="douyin">抖音</option><option value="toutiao">头条</option><option value="wechat_channels">视频号</option><option value="wechat_moments">朋友圈图文</option></select></label>
        <div class="oe-form-label" id="oeChildMomentField" hidden>
          <span>朋友圈联系人（按微信号保存，可多选）</span>
          <details class="oe-moment-dropdown">
            <summary id="oeChildMomentTrigger">选择通讯录联系人</summary>
            <div class="oe-moment-picker">
              <input id="oeChildMomentSearch" type="search" placeholder="搜索昵称、备注或微信号">
              <div class="oe-moment-list" id="oeChildMomentContacts"></div>
              <div class="oe-moment-footer"><button class="oe-mini-btn" id="oeChildMomentPrev" type="button" data-oe-action="moment-child-prev">上一页</button><span id="oeChildMomentPage">1 / 1</span><button class="oe-mini-btn" id="oeChildMomentNext" type="button" data-oe-action="moment-child-next">下一页</button></div>
              <div class="oe-moment-summary" id="oeChildMomentSummary"></div>
            </div>
          </details>
        </div>
        <label class="oe-form-label" hidden>互动动作<select id="oeChildMomentAction"><option value="like_comment">点赞并评论</option><option value="like">只点赞</option><option value="comment">只评论</option></select></label>
      </div>
      <div class="oe-modal-foot"><button type="button" class="oe-btn" data-oe-action="close-child-modal">取消</button><button type="button" class="oe-btn primary" data-oe-action="save-child">保存动作</button></div>
    </div>
  </div>
</section>
