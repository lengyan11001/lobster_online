<style>
  body.canvas-studio-active #appHeader { display: none !important; }
  body.canvas-studio-active .page { padding-top: 0 !important; }
  .canvas-dock-btn { padding:6px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#ffffffd9;backdrop-filter:blur(6px);color:#4b5563;font-size:13px;cursor:pointer;transition:all .15s; }
  .canvas-dock-btn.active { background:#111827;border-color:#111827;color:#fff; }
  .canvas-win-btn { width:30px;height:28px;border-radius:8px;border:1px solid #e5e7eb;background:#ffffffd9;backdrop-filter:blur(6px);color:#4b5563;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center; }
  .canvas-win-btn:hover { background:#f3f4f6; }
  #canvasWinClose:hover { background:#ef4444;border-color:#ef4444;color:#fff; }
</style>
<div class="canvas-studio-shell" id="lobsterCanvasStudioShell" style="width:100%;height:100vh;min-height:640px;position:relative;background:#fff;overflow:hidden;">
  <div id="lobsterCanvasDock" style="position:absolute;left:12px;top:10px;z-index:22;display:flex;gap:6px;">
    <button type="button" class="canvas-dock-btn" data-canvas-screen="inspiration">灵感</button>
    <button type="button" class="canvas-dock-btn" data-canvas-screen="generate">生成</button>
    <button type="button" class="canvas-dock-btn active" data-canvas-screen="projects">画布</button>
  </div>
  <div id="lobsterCanvasWin" style="position:absolute;right:10px;top:8px;z-index:22;display:flex;gap:6px;">
    <button type="button" class="canvas-win-btn" id="canvasWinMin" title="最小化">−</button>
    <button type="button" class="canvas-win-btn" id="canvasWinMax" title="最大化 / 还原">□</button>
    <button type="button" class="canvas-win-btn" id="canvasWinClose" title="关闭">×</button>
  </div>
  <button type="button" id="lobsterCanvasExit" title="返回工作台"
    style="position:absolute;left:12px;bottom:12px;z-index:22;width:32px;height:32px;border-radius:999px;border:1px solid #e5e7eb;background:#ffffffd9;backdrop-filter:blur(6px);color:#4b5563;cursor:pointer;font-size:14px;">←</button>
  <div class="canvas-studio-boot" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:14px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#666;background:#fff;">正在启动灵感画布…</div>
  <iframe
    id="lobster-canvas-frame"
    title="灵感画布"
    src="/static/canvas-ui/projects.html?v=20261026-canvas-ui-v5"
    style="width:100%;height:100%;border:0;background:#fff;display:none;"
    allow="clipboard-write; fullscreen"
  ></iframe>
</div>
