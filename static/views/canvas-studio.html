<div class="canvas-studio-shell" style="width:100%;height:calc(100vh - 120px);min-height:640px;position:relative;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;">
  <div class="canvas-studio-tabs" style="display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #eef2f7;background:#fff;flex:0 0 auto;">
    <button type="button" data-canvas-tab="inspiration" class="canvas-tab" style="padding:6px 16px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;font-size:13px;cursor:pointer;">灵感</button>
    <button type="button" data-canvas-tab="generate" class="canvas-tab" style="padding:6px 16px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;font-size:13px;cursor:pointer;">生成</button>
    <button type="button" data-canvas-tab="projects" class="canvas-tab" style="padding:6px 16px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;color:#4b5563;font-size:13px;cursor:pointer;">画布</button>
  </div>
  <div class="canvas-studio-boot" style="flex:1;display:flex;align-items:center;justify-content:center;font:14px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#666;background:#fff;">正在启动灵感画布…</div>
  <iframe
    id="lobster-canvas-frame"
    title="灵感画布"
    src="about:blank"
    style="width:100%;height:100%;border:0;background:#fff;display:none;flex:1 1 auto;"
    allow="clipboard-write; fullscreen"
  ></iframe>
</div>
