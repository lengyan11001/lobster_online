<link rel="stylesheet" href="/static/canvas-ui/fa.css">
<style>
  #lobsterCanvasStudioShell{display:flex;}
  .cv-rail{width:80px;background:rgba(249,250,251,.5);border-right:1px solid #f3f4f6;display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:24px;flex:0 0 auto;z-index:10;}
  .cv-rail-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;color:#9ca3af;cursor:pointer;border:0;background:transparent;transition:all .15s;}
  .cv-rail-item i{font-size:18px;margin-bottom:4px;}
  .cv-rail-item span{font-size:11px;}
  .cv-rail-item:hover{color:#374151;background:rgba(243,244,246,.8);}
  .cv-rail-item.active{background:#fff;color:#2563eb;box-shadow:0 4px 12px rgba(59,130,246,.15);}
  .cv-rail-item.active::after{content:"";position:absolute;inset:0;border-radius:16px;border:2px solid rgba(59,130,246,.2);}
</style>
<div class="canvas-studio-shell" id="lobsterCanvasStudioShell" style="width:100%;height:calc(100vh - 120px);min-height:640px;position:relative;background:#fff;border-radius:12px;overflow:hidden;">
  <div class="cv-rail">
    <button type="button" class="cv-rail-item" data-canvas-screen="inspiration"><i class="fa-solid fa-wand-magic-sparkles"></i><span>灵感</span></button>
    <button type="button" class="cv-rail-item" data-canvas-screen="generate"><i class="fa-solid fa-layer-group"></i><span>生成</span></button>
    <button type="button" class="cv-rail-item active" data-canvas-screen="projects"><i class="fa-solid fa-border-all"></i><span>画布</span></button>
  </div>
  <div class="canvas-studio-boot" style="position:absolute;left:80px;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:14px/1.7 system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#666;background:#fff;">正在启动灵感画布…</div>
  <iframe id="lobster-canvas-frame" title="灵感画布" src="/static/canvas-ui/projects.html?v=20261026-canvas-ui-v10" style="flex:1 1 auto;height:100%;border:0;background:#fff;display:none;" allow="clipboard-write; fullscreen"></iframe>
</div>
