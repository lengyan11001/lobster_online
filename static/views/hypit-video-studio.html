<div id="content-hypit-video-studio" class="content-block">
  <main class="hypit-page">
    <header class="hypit-page-head">
      <div>
        <span class="hypit-eyebrow">视频复刻工作台</span>
        <h2>视频复刻</h2>
        <p>点「添加复刻」上传参考视频；每条记录都能展开看原素材、过程素材和成片。</p>
      </div>
      <div class="hypit-head-actions">
        <button type="button" class="hypit-dep-chip" id="hypitDepChip">检查运行依赖中…</button>
        <button type="button" class="hypit-primary-button hypit-compact-button" id="hypitAddButton">＋ 添加复刻</button>
      </div>
    </header>

    <div class="hypit-message" id="hypitMessage" role="status" aria-live="polite" hidden></div>

    <div class="hypit-record-list" id="hypitList">
      <div class="hypit-empty"><span aria-hidden="true">▧</span><strong>正在读取记录…</strong></div>
    </div>

    <div class="hypit-pager" id="hypitPager"></div>

    <div class="hypit-modal-mask" id="hypitAddModal" hidden>
      <div class="hypit-modal" role="dialog" aria-modal="true" aria-labelledby="hypitAddTitle">
        <div class="hypit-modal-head">
          <b id="hypitAddTitle">添加复刻</b>
          <button type="button" class="hypit-text-button" id="hypitAddClose">关闭</button>
        </div>
        <div class="hypit-modal-body">
          <input id="hypitVideoInput" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,.mp4,.mov,.webm,.mkv" hidden>
          <button type="button" class="hypit-dropzone hypit-dropzone-compact" id="hypitChooseVideo">
            <span class="hypit-dropzone-mark" aria-hidden="true">+</span>
            <strong id="hypitChooseVideoTitle">选择本地视频</strong>
            <span>MP4、MOV、WebM、MKV，最大 1GB</span>
          </button>
          <div class="hypit-selected-file" id="hypitSelectedFile" hidden>
            <video id="hypitVideoPreview" controls playsinline preload="metadata"></video>
            <div class="hypit-file-row">
              <div><strong id="hypitFilename"></strong><span id="hypitFileMeta"></span></div>
              <button type="button" class="hypit-text-button" id="hypitReplaceVideo">更换</button>
            </div>
          </div>
          <label class="hypit-field">
            <span>改编方向（可选）</span>
            <textarea id="hypitBrief" rows="3" placeholder="例如：保留原视频节奏，把画面换成一只橘猫在厨房做饭，字幕保留主题"></textarea>
          </label>
          <div class="hypit-progress" id="hypitProgress" hidden>
            <div class="hypit-progress-track"><span id="hypitProgressBar"></span></div>
            <span id="hypitProgressText">准备中…</span>
          </div>
        </div>
        <div class="hypit-modal-foot">
          <button type="button" class="hypit-primary-button hypit-compact-button" id="hypitSubmitButton" disabled>确定创建记录</button>
          <button type="button" class="hypit-text-button" id="hypitAddCancel">取消</button>
        </div>
      </div>
    </div>

    <div class="hypit-modal-mask" id="hypitInstallModal" hidden>
      <div class="hypit-modal" role="dialog" aria-modal="true" aria-labelledby="hypitInstallTitle">
        <div class="hypit-modal-head">
          <b id="hypitInstallTitle">运行依赖</b>
          <button type="button" class="hypit-text-button" id="hypitInstallClose">关闭</button>
        </div>
        <div class="hypit-modal-body">
          <div class="hypit-runtime-list" id="hypitRuntimeList"></div>
          <div class="hypit-runtime-status" id="hypitRuntimeStatus" role="status" aria-live="polite">正在检查本机依赖…</div>
          <div class="hypit-progress" id="hypitInstallProgress" hidden>
            <div class="hypit-progress-track"><span id="hypitInstallBar" style="width:0%"></span></div>
            <span id="hypitInstallStage">准备中…</span>
          </div>
          <pre class="hypit-install-log" id="hypitInstallLog"></pre>
          <div class="hypit-install-error" id="hypitInstallError" hidden></div>
        </div>
        <div class="hypit-modal-foot">
          <button type="button" class="hypit-primary-button hypit-compact-button" id="hypitInstallStart">安装 / 修复运行依赖</button>
          <button type="button" class="hypit-text-button" id="hypitInstallRetry" hidden>重试</button>
        </div>
      </div>
    </div>

    <div class="hypit-modal-mask" id="hypitDetailModal" hidden>
      <div class="hypit-modal hypit-modal-wide" role="dialog" aria-modal="true" aria-labelledby="hypitDetailTitle">
        <div class="hypit-modal-head">
          <b id="hypitDetailTitle">记录详情</b>
          <button type="button" class="hypit-text-button" id="hypitDetailClose">关闭</button>
        </div>
        <div class="hypit-modal-body" id="hypitDetailBody"></div>
        <div class="hypit-modal-foot" id="hypitDetailFoot"></div>
      </div>
    </div>
  </main>
</div>
