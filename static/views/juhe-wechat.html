            <div id="nativeWechatGroupPagination" class="native-wechat-pagination"></div>
          </div>
          <div class="native-wechat-card">
            <div class="native-wechat-card-head">
              <div>
                <h3 id="nativeWechatGroupMemberTitle">群成员</h3>
                <div class="native-wechat-muted">选择群后同步成员。</div>
              </div>
              <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatSyncGroupMembersBtn">同步成员</button>
            </div>
            <div id="nativeWechatGroupMemberList" class="native-wechat-empty">请选择群</div>
            <div id="nativeWechatGroupMemberPagination" class="native-wechat-pagination"></div>
          </div>
        </div>
      </section>

      <section class="native-wechat-panel" data-native-wechat-panel="friends">
        <div class="native-wechat-card">
          <div class="native-wechat-card-head">
            <h3>添加好友</h3>
            <span class="native-wechat-chip" id="nativeWechatFriendState">待提交</span>
          </div>
          <div class="native-wechat-form-row">
            <div class="native-wechat-form-block">
              <label>微信号 / 手机号 / 昵称</label>
              <textarea id="nativeWechatFriendKeyword" class="native-wechat-textarea" placeholder="输入微信号、手机号或昵称；多个目标可换行或用逗号分隔"></textarea>
            </div>
            <div class="native-wechat-form-block">
              <label>备注</label>
              <input id="nativeWechatFriendRemark" class="native-wechat-input" placeholder="可不填">
            </div>
          </div>
          <div class="native-wechat-form-row">
            <div class="native-wechat-form-block">
              <label>验证消息</label>
              <input id="nativeWechatFriendApplyMessage" class="native-wechat-input" placeholder="加好友时发送">
            </div>
            <div class="native-wechat-form-block">
              <label>权限</label>
              <select id="nativeWechatFriendPermission" class="native-wechat-select">
                <option value="朋友圈">朋友圈</option>
                <option value="仅聊天">仅聊天</option>
              </select>
            </div>
          </div>
          <div class="native-wechat-form-block">
            <label>标签</label>
            <input id="nativeWechatFriendTags" class="native-wechat-input" placeholder="多个标签用逗号分隔">
          </div>
          <button type="button" class="btn btn-primary" id="nativeWechatAddFriendBtn">提交好友申请</button>
        </div>
      </section>

      <section class="native-wechat-panel" data-native-wechat-panel="moments">
        <div class="native-wechat-card">
          <div class="native-wechat-card-head">
            <h3>发朋友圈</h3>
            <span class="native-wechat-chip" id="nativeWechatMomentsState">待发布</span>
          </div>
          <div class="native-wechat-form-block">
            <label>正文</label>
            <textarea id="nativeWechatMomentsContent" class="native-wechat-textarea" placeholder="这一刻的想法..."></textarea>
          </div>
          <div class="native-wechat-form-row">
            <div class="native-wechat-form-block">
              <label>类型</label>
              <select id="nativeWechatMomentsMediaType" class="native-wechat-select">
                <option value="image_text">图文</option>
                <option value="video">视频</option>
              </select>
            </div>
            <div class="native-wechat-form-block">
              <label>可见范围</label>
              <select id="nativeWechatMomentsVisibility" class="native-wechat-select">
                <option value="public">公开</option>
              </select>
            </div>
          </div>
          <div class="native-wechat-form-block">
            <label>素材</label>
            <div class="native-wechat-actions">
              <input id="nativeWechatMomentsFileInput" type="file" multiple accept="image/*,video/*" style="display:none;">
              <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatMomentsChooseFileBtn">选择图片/视频</button>
              <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatMomentsClearFilesBtn">清空素材</button>
            </div>
            <div id="nativeWechatMomentsFileList" class="native-wechat-muted">未选择素材</div>
          </div>
          <button type="button" class="btn btn-primary" id="nativeWechatMomentsPublishBtn">发布到朋友圈</button>
        </div>
      </section>

      <section class="native-wechat-panel" data-native-wechat-panel="tasks">
        <div class="native-wechat-card">
          <div class="native-wechat-card-head">
            <h3>任务记录</h3>
            <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatRefreshTasksBtn">刷新</button>
          </div>
          <div id="nativeWechatTaskList" class="native-wechat-empty">暂无任务</div>
          <div id="nativeWechatTaskPagination" class="native-wechat-pagination"></div>
        </div>
      </section>

      <section class="native-wechat-panel" data-native-wechat-panel="accounts">
        <div class="native-wechat-grid">
          <div class="native-wechat-card">
            <div class="native-wechat-card-head">
              <h3>本机微信</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatRefreshAccountsBtn2">刷新</button>
            </div>
            <div id="nativeWechatAccountList" class="native-wechat-empty">暂无账号</div>
          </div>
          <div class="native-wechat-card">
            <div class="native-wechat-card-head">
              <h3>策略</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatRefreshStrategyBtn">刷新</button>
            </div>
            <div id="nativeWechatStrategyList" class="native-wechat-empty">暂无策略</div>
          </div>
        </div>
      </section>
    </div>

    <div class="native-wechat-modal-mask" id="nativeWechatContactPickerModal">
      <div class="native-wechat-modal native-wechat-contact-picker">
        <div class="native-wechat-modal-head">
          <h3 style="margin:0;">选择拉群主联系人</h3>
          <button type="button" class="btn btn-ghost btn-sm" data-native-wechat-close>关闭</button>
        </div>
        <input id="nativeWechatContactPickerSearch" class="native-wechat-input native-wechat-contact-picker-search" type="search" placeholder="搜索昵称、备注或微信号" autocomplete="off">
        <div id="nativeWechatContactPickerCount" class="native-wechat-contact-picker-count">0 位联系人</div>
        <div id="nativeWechatContactPickerList" class="native-wechat-contact-picker-list"></div>
        <div id="nativeWechatContactPickerPagination" class="native-wechat-pagination"></div>
        <div class="native-wechat-actions" style="justify-content:flex-end;">
          <button type="button" class="btn btn-ghost btn-sm" id="nativeWechatContactPickerClear">清除选择</button>
          <button type="button" class="btn btn-ghost btn-sm" data-native-wechat-close>取消</button>
        </div>
      </div>
    </div>

    <div class="native-wechat-modal-mask" id="nativeWechatDetailModal">
      <div class="native-wechat-modal">
        <div class="native-wechat-modal-head">
          <h3 id="nativeWechatDetailTitle" style="margin:0;">详情</h3>
          <button type="button" class="btn btn-ghost btn-sm" data-native-wechat-close>关闭</button>
        </div>
        <div id="nativeWechatDetailBody" class="native-wechat-detail-list"></div>
      </div>
    </div>
  </div>
</div>
